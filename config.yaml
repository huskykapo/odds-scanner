# Odds scanner configuration. Secrets are NEVER stored here - they come from environment variables.
# Works as-is with no API key: the Slovak bookmaker providers are on, The Odds API is off.

# ---- what to scan ------------------------------------------------------------------------
# Sports polled at every Slovak provider (unless a provider lists its own `sports`).
sports: [football, hockey, basketball, tennis]

# ---- arbitrage rules ---------------------------------------------------------------------
min_profit_percent: 0.5     # ignore arbs below this guaranteed profit %
verify_above_percent: 10    # show arbs above this with a "VERIFY MANUALLY" flag (often a pricing error)
max_profit_percent: 25      # above this it is almost always bad/stale data: dropped. null disables
bankroll: 100               # total amount split across the legs of each arb (the dashboard can change it)
currency: EUR               # display only
stake_rounding: 0.5         # default stake step; per bookmaker: bookmaker_settings.<key>.stake_step
stale_after_seconds: 300    # ignore prices fetched longer ago than this

# ---- odds sources --------------------------------------------------------------------------
# Every provider runs in its own thread. Common settings per provider:
#   enabled, poll_interval_seconds, timeout_seconds, max_retries, retry_backoff_seconds,
#   min_request_interval_seconds (>= 1: never more than one request per second per site),
#   sports (overrides the list above), options (provider specific, see below).
# A site that answers 403 / a captcha page is shown as "blocked" and is no longer polled.
providers:
  monacobet:
    poll_interval_seconds: 120   # whole-sport feed is ~5 MB for football
    options:
      sport_codes: {football: S, hockey: H, basketball: B, tennis: T}
      # league_ids: {football: [2529497]}   # fetch only these leagues (much smaller responses)
      # tip_types: {4: "1X", 5: "12", 6: "X2"}   # extra betMap tip types, if you identify them
  doxxbet:
    poll_interval_seconds: 60
    options:
      sport_ids: {football: 54}    # add hockey/basketball/tennis ids from the site's GetOfferList requests
      dates: [TD, TM]              # offer days requested ("TM" = tomorrow is verified)
  nike:
    poll_interval_seconds: 60
    options:
      menus: {football: /futbal, hockey: /hokej, basketball: /basketbal, tennis: /tenis}
      max_pages: 5                 # follow hasMoreBets up to this many pages
      page_param: page
  tipos:
    poll_interval_seconds: 60
    options:
      category_ids: {football: "28"}   # add other sports' CategoryID from the site's requests
      top: 50
  synot:
    poll_interval_seconds: 60
    options:
      category_ids: {football: "28"}
      top: 50
  the_odds_api:                  # paid/quota-limited API - off by default
    enabled: false
    poll_interval_seconds: 600
    sports: [soccer_epl]         # Odds API sport keys
    options: {api_key_env: ODDS_API_KEY}

# Odds API request settings (only used when the_odds_api is enabled, or with --replay)
regions: [eu]
markets: [h2h, totals]
bookmakers: []

# ---- per-bookmaker money rules -------------------------------------------------------------
# stake_step: round stakes to this (EUR). min_stake: the bookmaker's minimum bet.
# stake_fee / win_tax: percent taken from the stake / from net winnings - applied BEFORE prices
# are compared, so an arb that a fee would eat is never shown.
bookmaker_settings:
  monacobet: {stake_step: 0.5, min_stake: 1, stake_fee: 0, win_tax: 0}
  doxxbet:   {stake_step: 0.5, min_stake: 1, stake_fee: 0, win_tax: 0}
  nike:      {stake_step: 0.5, min_stake: 1, stake_fee: 0, win_tax: 0}
  tipos:     {stake_step: 0.5, min_stake: 1, stake_fee: 0, win_tax: 0}
  synot:     {stake_step: 0.5, min_stake: 1, stake_fee: 0, win_tax: 0}

# ---- event matching --------------------------------------------------------------------------
matching:
  time_tolerance_minutes: 15   # kick-off times may differ by this much
  name_threshold: 0.8          # 0..1, both team names must reach it
  aliases:                     # one bookmaker's spelling -> another's (accents/case don't matter)
    # "Slovan": "ŠK Slovan Bratislava"
    # "Austria": "Rakúsko"

# ---- web dashboard -------------------------------------------------------------------------
dashboard:
  enabled: true
  host: 0.0.0.0        # reachable from a phone on the same Wi-Fi; 127.0.0.1 = this PC only
  port: 8765
  refresh_seconds: 3
  highlight_seconds: 120

# ---- notifications -----------------------------------------------------------------------
notifications:
  console: true                     # print each new arb in the terminal
  telegram:
    enabled: false
    token_env: TELEGRAM_BOT_TOKEN   # name of the env var holding the bot token
    chat_id_env: TELEGRAM_CHAT_ID   # name of the env var holding the chat id
    min_profit_percent: null        # alert threshold; null = min_profit_percent
  dedupe_ttl_minutes: 60            # don't re-send / re-log an identical arb within this window
  max_per_cycle: 10                 # cap on Telegram messages per analysis

# ---- logging every arb found ---------------------------------------------------------------
storage:
  backend: both           # csv | sqlite | both | none
  csv_path: data/arbs.csv
  sqlite_path: data/arbs.db

# ---- legacy single-provider mode (python -m odds_scanner --replay FILE) ----------------------
provider:
  name: the_odds_api      # the_odds_api | replay
  api_key_env: ODDS_API_KEY
  timeout_seconds: 15
  max_retries: 2
poll_interval_seconds: 600
quota:
  backoff_below: 100
  backoff_multiplier: 4
  stop_below: 10

log_level: INFO
