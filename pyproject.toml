[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odds-scanner"
version = "0.1.0"
description = "Slovak-bookmaker arbitrage (surebet) scanner with a local dashboard. Alerts only - never places bets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
odds-scanner = "odds_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["odds_scanner*"]

[tool.setuptools.package-data]
odds_scanner = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
